[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tome"
version = "0.1.0"
description = "Codebase scanner and visualizer."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tome = "tome.cli:main"

[tool.setuptools.packages.find]
include = ["tome*"]
exclude = ["visualizer*", "tests*", "scripts*", "docs*"]

[tool.setuptools.package-data]
"tome" = ["_bundled/visualizer/**/*"]
